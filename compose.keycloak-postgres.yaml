# Opt in only during the documented Keycloak migration, after an H2 backup/export.
# Append to COMPOSE_FILE; retain compose.nfc.yaml and compose.postgres.yaml.
# This neither creates a database nor imports realms automatically.
services:
  keycloak:
    command: ["start"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: ${KEYCLOAK_POSTGRES_DB:?Set a separate Keycloak database name}
      KC_DB_USERNAME: ${KEYCLOAK_POSTGRES_USER:?Set the dedicated Keycloak database role}
      KC_DB_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:?Set the dedicated Keycloak database password}
      KC_DB_SCHEMA: public
    networks: [default, database]
    depends_on:
      postgres:
        condition: service_healthy
    # Replaces the base mount at this container target; never mount live H2 here.
    # PostgreSQL records live in OAKGATE_POSTGRES_DATA_DIR, not this work directory.
    volumes:
      - type: bind
        source: ${KEYCLOAK_POSTGRES_WORK_DIR:?Set a new Keycloak work directory distinct from KEYCLOAK_DATA_DIR}
        target: /opt/keycloak/data
        bind:
          create_host_path: false
