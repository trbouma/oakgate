{% extends "base.html" %}
{% block content %}
<p class="eyebrow">WELCOME INSIDE</p><h1>Hello, {{ user.name }}.</h1>
{% if user.email %}<p class="intro">{{ user.email }}</p>{% endif %}
<div class="status"><span class="dot" aria-hidden="true"></span> You are signed in</div>
<p class="note">Your safebox experience is coming next.</p>
<form method="post" action="/auth/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="primary-action" type="submit">Sign out</button></form>
{% endblock %}
