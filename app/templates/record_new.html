{% extends "base.html" %}
{% block content %}
<h1 class="account-page-title">{{ _('Add Record') }}</h1>
<section class="wallet-panel preferences-panel">
<form method="post" action="/account/add-record" enctype="multipart/form-data" class="record-form" data-progress-message="{{ _('Saving your record. Please wait…') }}">
<input type="hidden" name="csrf" value="{{ csrf }}">
<label for="record-label">{{ _('Label') }}</label><input type="text" id="record-label" name="label" required maxlength="200" autocomplete="off">
<label for="record-format">{{ _('Format') }}</label><select id="record-format" name="format"><option value="text">{{ _('Text') }}</option><option value="json">{{ _('JSON') }}</option></select>
<label for="record-payload">{{ _('Contents') }}</label><textarea id="record-payload" name="payload" rows="8"></textarea>
<label for="record-attachment">{{ _('Attach a file') }} {{ _('(optional, up to 25 MiB)') }}</label><input type="file" id="record-attachment" name="attachment">
<section class="attachment-preview" data-attachment-preview hidden
 data-unavailable="{{ _('Preview unavailable for this file type. You can still save it.') }}"
 data-too-large="{{ _('Choose a nonempty file up to 25 MiB.') }}"
 data-loading="{{ _('Loading preview…') }}"
 data-pdf-page="{{ _('PDF preview — first page') }}">
<p data-attachment-name></p><p data-attachment-status role="status"></p>
<div data-attachment-content></div>
<button type="button" class="secondary-action" data-attachment-remove>{{ _('Remove file') }}</button>
</section>
<p class="note">{{ _('The preview stays in your browser. Save record to upload the file to your Acorn.') }}</p>
<script type="module" src="/static/attachment-preview.js?v=1"></script>
<button class="primary-action" type="submit">{{ _('Save record') }}</button>
<a class="secondary-action" href="/account/records">{{ _('Cancel') }}</a>
</form>
</section>
{% endblock %}
