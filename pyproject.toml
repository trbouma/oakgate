[tool.poetry]
name = "oakgate"
version = "0.1.0"
description = "OpenID Access Gate — part of the Mainstay family"
authors = ["Tim Bouma"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = ">=0.115,<1.0"
uvicorn = {version = ">=0.30,<1.0", extras = ["standard"]}
authlib = ">=1.6,<1.7"
httpx = ">=0.27,<1.0"
redis = ">=5,<7"
jinja2 = ">=3.1,<4"
python-multipart = ">=0.0.20,<1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<10"
httpx = ">=0.27,<1.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6,<2"
mkdocs-material = ">=9.5,<10"
pymdown-extensions = ">=10,<11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=1.9,<2.0"]
build-backend = "poetry.core.masonry.api"
