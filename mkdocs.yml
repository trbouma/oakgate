site_name: OakGate
site_description: A welcoming way into your safebox. Managed by default, with a path to independence.
site_url: https://trbouma.github.io/oakgate/
repo_url: https://github.com/trbouma/oakgate
repo_name: trbouma/oakgate
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  font: false
  logo: assets/oakgate-logo.png
  favicon: assets/oakgate-logo.png
  features:
    - navigation.top
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Use light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Understand OakGate:
      - Product direction: product-direction.md
      - Mainstay principles: 010-mainstay-principles.md
      - Custody models: 006-custody-models.md
      - Go Independent: 004-go-independent.md
      - Project status: project-status.md
  - Build and deploy:
      - FastAPI app: 003-fastapi-app.md
      - Connect sign-in: 005-keycloak-sign-in.md
      - Connect an Acorn: 007-acorn-custody.md
      - Records and sharing: 011-record-workflows.md
      - Language preferences: 012-localization.md
      - Local currency and rates: 013-local-currency.md
      - Direct Safebox payments: 014-direct-ecash-payments.md
      - Clear payments: 015-clear-payments.md
      - Lightning payments and zaps: 009-lightning-receiving.md
      - Identity storage and backups: 008-identity-storage-backups.md
      - Keycloak on Beelink: 002-keycloak-beelink.md
      - Authentication design: 001-authentication-design.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css
copyright: OakGate is open-source software released under the MIT License.
