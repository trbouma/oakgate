site_name: OakGate
site_description: A welcoming way into your safebox. Managed by default, with a path to independence.
site_url: https://trbouma.github.io/oakgate/
repo_url: https://github.com/trbouma/oakgate
repo_name: trbouma/oakgate
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  font: false
  logo: assets/oakgate-logo.png
  favicon: assets/oakgate-logo.png
  features:
    - navigation.top
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Use light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - User Experiences:
      - Overview: user-experiences/index.md
      - From a wallet to a card: user-experiences/card-pairing-and-payments.md
      - One wallet, several counters: user-experiences/one-wallet-several-counters.md
  - Understand OakGate:
      - Product direction: product-direction.md
      - Mainstay client roles: 021-mainstay-client-roles.md
      - Home and satellite instances: 037-home-and-satellite-instances.md
      - Mainstay principles: 010-mainstay-principles.md
      - Custody models: 006-custody-models.md
      - Go Independent: 004-go-independent.md
      - Project status: project-status.md
  - Build and deploy:
      - New PostgreSQL instance: 035-new-instance.md
      - FastAPI app: 003-fastapi-app.md
      - Public service contract: 017-public-service-contract.md
      - Keycloak operations and flows: 028-keycloak-operations.md
      - Keycloak PostgreSQL migration: 034-keycloak-postgresql.md
      - Connect sign-in: 005-keycloak-sign-in.md
      - Connect an Acorn: 007-acorn-custody.md
      - Recovery disclosure: 016-recovery-disclosure.md
      - Records and sharing: 011-record-workflows.md
      - Language preferences: 012-localization.md
      - Local currency and rates: 013-local-currency.md
      - Direct Safebox payments: 014-direct-ecash-payments.md
      - Wallet messages: 019-wallet-messages.md
      - Safebox address discovery: 018-safebox-address-discovery.md
      - Clear payments: 015-clear-payments.md
      - Scan and Receive: 020-scan-and-receive.md
      - Receive-only POS design: 023-receive-only-pos.md
      - POS deployment: 024-pos-deployment.md
      - POS NFC cards: 025-pos-nfc-cards.md
      - Everyday NFC card trust: 029-nfc-card-trust.md
      - NFC cards and payment execution: 026-nfc-card-payments.md
      - Keycloak NFC login: 027-keycloak-nfc-login.md
      - Lightning payments and zaps: 009-lightning-receiving.md
      - SQLite Alembic baseline: 031-sqlite-alembic-baseline.md
      - PostgreSQL foundation: 030-postgresql-foundation.md
      - PostgreSQL storage: 032-postgresql-storage.md
      - PostgreSQL import and cutover: 033-postgresql-cutover.md
      - Backup and recovery plan: 036-backup-and-recovery-plan.md
      - Identity storage and backups: 008-identity-storage-backups.md
      - Storage latency incident: 022-storage-latency-incident.md
      - Keycloak on Beelink: 002-keycloak-beelink.md
      - Authentication design: 001-authentication-design.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css
copyright: OakGate is open-source software released under the MIT License.
