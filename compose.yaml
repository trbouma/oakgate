name: oakgate

services:
  app:
    build:
      context: .
    restart: unless-stopped
    environment:
      OAKGATE_PUBLIC_URL: ${OAKGATE_PUBLIC_URL:-https://oakgate.safebox.dev}
      OAKGATE_OIDC_ISSUER: ${OAKGATE_OIDC_ISSUER:-https://keycloak.safebox.dev/realms/oakgate}
      OAKGATE_OIDC_CLIENT_ID: ${OAKGATE_OIDC_CLIENT_ID:-oakgate-web}
      OAKGATE_OIDC_CLIENT_SECRET: ${OAKGATE_OIDC_CLIENT_SECRET:-}
      OAKGATE_SESSION_TTL_SECONDS: ${OAKGATE_SESSION_TTL_SECONDS:-604800}
      OAKGATE_REDIS_URL: redis://sessions:6379/0
      OAKGATE_SERVICE_MANAGEMENT: ${OAKGATE_SERVICE_MANAGEMENT:-independent}
      OAKGATE_SERVICE_NSEC: ${OAKGATE_SERVICE_NSEC:-}
      OAKGATE_CUSTODY_KEY: ${OAKGATE_CUSTODY_KEY:-}
      OAKGATE_DATA_DIR: /app/data
      OAKGATE_PAYMENTS_ENABLED: ${OAKGATE_PAYMENTS_ENABLED:-true}
      OAKGATE_REQUIRE_DESCRIPTION_HASH: ${OAKGATE_REQUIRE_DESCRIPTION_HASH:-false}
      OAKGATE_BLOSSOM_SERVER: ${OAKGATE_BLOSSOM_SERVER:-https://grove.safebox.dev}
      OAKGATE_TRANSFER_SERVER: ${OAKGATE_TRANSFER_SERVER:-https://grove.safebox.dev}
      OAKGATE_OPENETR_RELAYS: ${OAKGATE_OPENETR_RELAYS:-wss://relay.openetr.org}
      OAKGATE_OPENETR_PUBLIC_BASE_URL: ${OAKGATE_OPENETR_PUBLIC_BASE_URL:-https://openetr.org/etr}
      OAKGATE_OPENETR_QUERY_TIMEOUT_SECONDS: ${OAKGATE_OPENETR_QUERY_TIMEOUT_SECONDS:-5}
      OAKGATE_OPENETR_QUERY_LIMIT: ${OAKGATE_OPENETR_QUERY_LIMIT:-100}
      OAKGATE_OPENETR_BLOSSOM_SERVERS: ${OAKGATE_OPENETR_BLOSSOM_SERVERS:-https://grove.safebox.dev}
      OAKGATE_RECORD_ALLOWED_SERVERS: ${OAKGATE_RECORD_ALLOWED_SERVERS:-https://grove.safebox.dev}
      OAKGATE_CURRENCY_RATES_ENABLED: ${OAKGATE_CURRENCY_RATES_ENABLED:-true}
      OAKGATE_DEFAULT_CURRENCY: ${OAKGATE_DEFAULT_CURRENCY:-USD}
      OAKGATE_CURRENCY_RATE_SOURCE_URL: ${OAKGATE_CURRENCY_RATE_SOURCE_URL:-https://blockchain.info/ticker}
      OAKGATE_CURRENCY_RATE_INTERVAL_SECONDS: ${OAKGATE_CURRENCY_RATE_INTERVAL_SECONDS:-3600}
      OAKGATE_CURRENCY_RATE_STALE_SECONDS: ${OAKGATE_CURRENCY_RATE_STALE_SECONDS:-86400}
      OAKGATE_BOOTSTRAP_MINT: ${OAKGATE_BOOTSTRAP_MINT:-https://mint.safebox.dev}
      OAKGATE_CLEAR_RECEIVE_ENABLED: ${OAKGATE_CLEAR_RECEIVE_ENABLED:-true}
      OAKGATE_ECASH_RECEIVE_ENABLED: ${OAKGATE_ECASH_RECEIVE_ENABLED:-true}
      OAKGATE_ECASH_POLL_SECONDS: ${OAKGATE_ECASH_POLL_SECONDS:-30}
      OAKGATE_ZAP_RELAYS: ${OAKGATE_ZAP_RELAYS:-wss://relay.primal.net,wss://relay.damus.io,wss://nos.lol}
      OAKGATE_RECEIVE_MIN_SAT: ${OAKGATE_RECEIVE_MIN_SAT:-1}
      OAKGATE_RECEIVE_MAX_SAT: ${OAKGATE_RECEIVE_MAX_SAT:-1000000}
      OAKGATE_PAYMENT_POLL_SECONDS: ${OAKGATE_PAYMENT_POLL_SECONDS:-5}
      OAKGATE_BOOTSTRAP_RELAY: ${OAKGATE_BOOTSTRAP_RELAY:-wss://spurline.safebox.dev}
      OAKGATE_ALLOWED_RELAYS: ${OAKGATE_ALLOWED_RELAYS:-wss://spurline.safebox.dev}
    volumes:
      - type: bind
        source: ${OAKGATE_DATA_DIR:-/mnt/bitcoin/oakgate}
        target: /app/data
        bind:
          create_host_path: false
    depends_on:
      sessions:
        condition: service_healthy
    ports:
      - "${OAKGATE_BIND_ADDRESS:-0.0.0.0}:${OAKGATE_PORT:-8801}:8000"

  sessions:
    image: redis:7.4-alpine
    tmpfs:
      - /data
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev"]
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set KC_BOOTSTRAP_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: ${KC_HOSTNAME:-https://keycloak.safebox.dev}
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_PROXY_HEADERS: xforwarded
    # Internal management port only; do not publish port 9000 through Nginx.
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep -q 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000"
      interval: 5s
      timeout: 3s
      start_period: 300s
      retries: 12
    ports:
      - "${KEYCLOAK_BIND_ADDRESS:-0.0.0.0}:${KEYCLOAK_PORT:-8800}:8080"
    volumes:
      - type: bind
        source: ${KEYCLOAK_DATA_DIR:-/mnt/bitcoin/keycloak}
        target: /opt/keycloak/data
        bind:
          create_host_path: false
